[package]
name = "humble-library"
version = "0.2.0"
description = "Local Humble Bundle library and key exporter"
authors = ["Nyanma"]
edition = "2021"
license = "MIT"

[lib]
name = "humble_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
arboard = "3"
webbrowser = "1"
reqwest = { version = "0.13", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
